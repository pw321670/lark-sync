# Trellis Configuration
# Project-specific notes for sync-obsidian-feishu.
#
# In this repository:
# - backend spec == sync core, auth flow, Feishu integration, local state
# - frontend spec == future Obsidian plugin shell, settings, commands, UX
# - shared guides == migration and sync-safety thinking support

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH pointing to task.json.
# Hook failures should not block the main task operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# This repo is currently single-repo.
# If the standalone scripts are later split into packages, common candidates are:
#
# packages:
#   sync-core:
#     path: packages/sync-core
#   obsidian-plugin:
#     path: packages/obsidian-plugin
#
# default_package: sync-core

#-------------------------------------------------------------------------------
# Optional Session Notes
#-------------------------------------------------------------------------------

# If this repo becomes a real monorepo later, consider enabling:
#
# session:
#   spec_scope: active_task
